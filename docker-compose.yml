services:
  db:
    image: postgres:16-alpine
    container_name: arrowfin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arrowfin
      POSTGRES_PASSWORD: arrowfin
      POSTGRES_DB: arrowfin
    # 5433 on purpose: 5432 is usually taken by a local Postgres install.
    ports:
      - '5433:5432'
    volumes:
      - arrowfin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arrowfin -d arrowfin']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  arrowfin-pgdata:
