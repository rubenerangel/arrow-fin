services:
  db:
    image: postgres:16-alpine
    container_name: arrowfin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arrowfin
      POSTGRES_PASSWORD: arrowfin
      POSTGRES_DB: arrowfin
    # 5435 rather than 5432: dev machines usually have a local Postgres on the default
    # port, and often another project's container on 5433/5434. Change it here and in
    # apps/api/.env if 5435 is taken on yours.
    ports:
      - '5435:5432'
    volumes:
      - arrowfin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arrowfin -d arrowfin']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  arrowfin-pgdata:
